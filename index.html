<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fde-hello</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #0b1020;
      color: #e8eefc;
    }
    main {
      text-align: center;
      padding: 2rem;
      border: 1px solid #2a3555;
      border-radius: 16px;
      background: #121a2f;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 .5rem; font-size: 2rem; }
    p { margin: 0; opacity: .8; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #1c2744;
      padding: .15rem .4rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world</h1>
    <p>Deployed from prompts via <code>GitHub → Vercel</code>.</p>
  </main>
</body>
</html>
